<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Biblioteca de Coros</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f8fafc; color: #1e293b; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
    header { background: #1e3a8a; color: white; padding: 0.8rem 1rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; }
    .btn { background: white; color: #1e3a8a; border: none; padding: 0.5rem 0.9rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-primary { background: #1e3a8a; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .container { display: flex; flex: 1; position: relative; overflow: hidden; }
    .view-panel { width: 100%; height: 100%; display: flex; flex-direction: column; background: white; position: absolute; top: 0; left: 0; transition: transform 0.2s ease; }
    #searchPanel { z-index: 1; }
    #songPanel { z-index: 2; transform: translateX(100%); padding: 1rem; overflow-y: auto; }
    #songPanel.active { transform: translateX(0); }
    .search-box { padding: 0.8rem; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; }
    .search-box input { width: 100%; padding: 0.7rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; }
    .song-list { flex: 1; overflow-y: auto; list-style: none; }
    .song-item { padding: 1rem; border-bottom: 1px solid #e2e8f0; cursor: pointer; }
    .song-item:active { background: #eff6ff; }
    .song-item .title { font-weight: 600; font-size: 1rem; color: #1e3a8a; }
    .song-item .preview { font-size: 0.85rem; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .back-btn { display: inline-block; color: #1e3a8a; font-weight: 600; margin-bottom: 1rem; cursor: pointer; background: #e0e7ff; padding: 0.4rem 0.8rem; border-radius: 20px; }
    .song-header h2 { color: #1e3a8a; font-size: 1.3rem; margin-bottom: 0.3rem; }
    .song-key { display: inline-block; font-size: 0.85rem; background: #e0e7ff; color: #1e3a8a; padding: 0.2rem 0.6rem; border-radius: 10px; font-weight: bold; margin-bottom: 1rem; }
    .song-lyrics { font-size: 1.15rem; line-height: 1.6; white-space: pre-line; margin-bottom: 1.5rem; color: #0f172a; }
    .medley-section { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
    .medley-section h3 { font-size: 0.95rem; color: #d97706; margin-bottom: 0.8rem; }
    .medley-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .medley-tag { background: white; border: 1px solid #cbd5e1; padding: 0.75rem; border-radius: 8px; font-size: 0.95rem; text-align: left; cursor: pointer; }
    .actions { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
    .actions .btn { flex: 1; padding: 0.75rem; text-align: center; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); align-items: flex-end; z-index: 1000; }
    .modal-content { background: white; padding: 1.2rem; border-radius: 16px 16px 0 0; width: 100%; max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.9rem; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    .modal-buttons { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .modal-buttons .btn { flex: 1; padding: 0.75rem; }
    @media (min-width: 768px) {
      .view-panel { position: relative; }
      #searchPanel { width: 320px; border-right: 1px solid #e2e8f0; }
      #songPanel { transform: translateX(0); flex: 1; }
      .back-btn { display: none; }
      .modal { align-items: center; }
      .modal-content { border-radius: 12px; max-width: 500px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Mis Coros</h1>
    <button class="btn" onclick="openModal()">+ Crear Coro</button>
  </header>

  <div class="container">
    <div class="view-panel" id="searchPanel">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar por título o letra..." oninput="renderSongList()">
      </div>
      <ul class="song-list" id="songList"></ul>
    </div>

    <div class="view-panel" id="songPanel">
      <div class="back-btn" onclick="closeSongView()">⬅ Volver a la lista</div>
      <div id="songContent">
        <p style="text-align: center; color: #64748b; margin-top: 3rem;">Selecciona un coro de la lista para leerlo.</p>
      </div>
    </div>
  </div>

  <div class="modal" id="songModal">
    <div class="modal-content">
      <h2 id="modalTitle" style="margin-bottom: 1rem; font-size: 1.1rem;">Agregar Coro</h2>
      <input type="hidden" id="songId">
      <div class="form-group">
        <label>Título del Coro</label>
        <input type="text" id="songTitle">
      </div>
      <div class="form-group">
        <label>Tonalidad (Opcional)</label>
        <input type="text" id="songKey" placeholder="Ej. Sol Mayor / G">
      </div>
      <div class="form-group">
        <label>Letra</label>
        <textarea id="songLyrics" rows="5"></textarea>
      </div>
      <div class="form-group">
        <label>Medley / Coros Relacionados</label>
        <select id="songRelations" multiple style="height: 100px;"></select>
      </div>
      <div class="modal-buttons">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveSong()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    var songs = JSON.parse(localStorage.getItem('coros_db')) || [
      { id: '1', title: 'Ejemplo: Aquí en esta iglesia', key: 'G', lyrics: 'Aquí en esta iglesia de fe y de poder...', relations: ['2'] },
      { id: '2', title: 'Ejemplo: Fuego, fuego', key: 'Em', lyrics: 'Fuego, fuego, la iglesia pide fuego...', relations: ['1'] }
    ];
    var currentSongId = null;

    function saveToStorage() {
      localStorage.setItem('coros_db', JSON.stringify(songs));
    }

    function renderSongList() {
      var query = document.getElementById('searchInput').value.toLowerCase();
      var listEl = document.getElementById('songList');
      listEl.innerHTML = '';

      var filtered = songs.filter(function(s) {
        return s.title.toLowerCase().indexOf(query) !== -1 || s.lyrics.toLowerCase().indexOf(query) !== -1;
      });

      filtered.forEach(function(song) {
        var li = document.createElement('li');
        li.className = 'song-item';
        li.onclick = function() { selectSong(song.id); };
        li.innerHTML = '<div class="title">' + song.title + '</div><div class="preview">' + song.lyrics.replace(/\n/g, ' ') + '</div>';
        listEl.appendChild(li);
      });
    }

    function selectSong(id) {
      currentSongId = id;
      var song = songs.find(function(s) { return s.id === id; });
      var contentEl = document.getElementById('songContent');
      if (!song) return;

      var relatedSongs = songs.filter(function(s) {
        return (song.relations || []).indexOf(s.id) !== -1;
      });

      var medleysHtml = '';
      if (relatedSongs.length > 0) {
        relatedSongs.forEach(function(r) {
          medleysHtml += '<button class="medley-tag" onclick="selectSong(\'' + r.id + '\')">🎶 ' + r.title + '</button>';
        });
      } else {
        medleysHtml = '<span style="color:#64748b; font-size:0.85rem;">No hay coros en este medley.</span>';
      }

      contentEl.innerHTML = 
        '<div class="song-header">' +
          '<h2>' + song.title + '</h2>' +
          (song.key ? '<span class="song-key">Tono: ' + song.key + '</span>' : '') +
        '</div>' +
        '<div class="song-lyrics">' + song.lyrics + '</div>' +
        '<div class="medley-section">' +
          '<h3>🎵 Medley / Continuar cantando con:</h3>' +
          '<div class="medley-list">' + medleysHtml + '</div>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="btn btn-primary" onclick="openModal(\'' + song.id + '\')">Editar</button>' +
          '<button class="btn btn-danger" onclick="deleteSong(\'' + song.id + '\')">Eliminar</button>' +
        '</div>';

      document.getElementById('songPanel').classList.add('active');
    }

    function closeSongView() {
      document.getElementById('songPanel').classList.remove('active');
    }

    function openModal(id) {
      var selectEl = document.getElementById('songRelations');
      selectEl.innerHTML = '';

      if (id) {
        var song = songs.find(function(s) { return s.id === id; });
        document.getElementById('modalTitle').innerText = 'Editar Coro';
        document.getElementById('songId').value = song.id;
        document.getElementById('songTitle').value = song.title;
        document.getElementById('songKey').value = song.key || '';
        document.getElementById('songLyrics').value = song.lyrics;

        songs.filter(function(s) { return s.id !== id; }).forEach(function(s) {
          var opt = document.createElement('option');
          opt.value = s.id;
          opt.innerText = s.title;
          if ((song.relations || []).indexOf(s.id) !== -1) opt.selected = true;
          selectEl.appendChild(opt);
        });
      } else {
        document.getElementById('modalTitle').innerText = 'Agregar Coro';
        document.getElementById('songId').value = '';
        document.getElementById('songTitle').value = '';
        document.getElementById('songKey').value = '';
        document.getElementById('songLyrics').value = '';

        songs.forEach(function(s) {
          var opt = document.createElement('option');
          opt.value = s.id;
          opt.innerText = s.title;
          selectEl.appendChild(opt);
        });
      }

      document.getElementById('songModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('songModal').style.display = 'none';
    }

    function saveSong() {
      var id = document.getElementById('songId').value;
      var title = document.getElementById('songTitle').value.trim();
      var key = document.getElementById('songKey').value.trim();
      var lyrics = document.getElementById('songLyrics').value.trim();
      
      var selectEl = document.getElementById('songRelations');
      var selectedRelations = [];
      for (var i = 0; i < selectEl.options.length; i++) {
        if (selectEl.options[i].selected) {
          selectedRelations.push(selectEl.options[i].value);
        }
      }

      if (!title || !lyrics) {
        alert('Ingresa el título y la letra.');
        return;
      }

      if (id) {
        var song = songs.find(function(s) { return s.id === id; });
        song.title = title;
        song.key = key;
        song.lyrics = lyrics;
        song.relations = selectedRelations;
      } else {
        var newId = Date.now().toString();
        songs.push({ id: newId, title: title, key: key, lyrics: lyrics, relations: selectedRelations });
        currentSongId = newId;
      }

      saveToStorage();
      closeModal();
      renderSongList();
      if (currentSongId) selectSong(currentSongId);
    }

    function deleteSong(id) {
      if (confirm('¿Seguro que deseas eliminar este coro?')) {
        songs = songs.filter(function(s) { return s.id !== id; });
        songs.forEach(function(s) {
          if (s.relations) {
            s.relations = s.relations.filter(function(rId) { return rId !== id; });
          }
        });
        saveToStorage();
        closeSongView();
        renderSongList();
      }
    }

    renderSongList();
  </script>
</body>
</html>
